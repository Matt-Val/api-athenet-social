server.port=${SERVER_PORT:8085}
spring.application.name=social
# Carga variables desde un .env local si existe. En la EC2
# no existe ese archivo y las variables legan por el entorno del contenedor.
spring.config.import=optional:file:.env[.properties]
# -- Base de Datos -- 
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/social_db}
spring.datasource.username=${DB_USERNAME:social_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema lo gestiona Flyway, Hibernate solo valida que
# las entidades coincidan con las tablas, nunca las modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Un cuerpo con un campo desconocido (cognitoSub) se rechaza con 400
# en vez de ignorarse, es la defensa contra a suplantación de identidad.
spring.jackson.deserialization.fail-on-unknown-properties=true

# -- Seguridad: Cognito --
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI}
athenet.cognito.client-id=${COGNITO_CLIENT_ID}
athenet.cognito.userinfo-uri=${COGNITO_USERINFO_URI}

# -- CORS -- 
athenet.cors.public-origins=${CORS_PUBLIC_ORIGINS:http://localhost:5173}
athenet.cors.user-origins=${CORS_USER_ORIGINS:http://localhost:5173}

# -- Actuator -- 
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# -- Logging -- 
logging.level.com.athenet.social=${LOG_LEVEL_SOCIAL:INFO}

