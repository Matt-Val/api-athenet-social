services:
  postgres:
    image: postgres:17-alpine
    container_name: athenet-social-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: social_db
      POSTGRES_USER: social_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-social_local}
    ports:
      - "5435:5432"
    volumes: 
      - social-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_user -d social_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  social-db-data: