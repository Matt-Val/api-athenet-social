name: Build, Push and Deploy

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: social_test
          POSTGRES_USER: social_user
          POSTGRES_PASSWORD: social_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U social_user -d social_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/social_test
      DB_USERNAME: social_user
      DB_PASSWORD: social_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify

  build-and-push:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Set Docker Hub image name
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          : "${DOCKERHUB_USERNAME:?Configura la variable DOCKERHUB_USERNAME}"
          echo "name=${DOCKERHUB_USERNAME}/api-athenet-social" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: social-ec2-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_REF: ${{ needs.build-and-push.outputs.image }}:${{ github.sha }}
        with:
          host: ${{ secrets.EC2_APP_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_REF
          command_timeout: 10m
          script: |
            set -eu
            # El archivo con los secretos vive solo en la EC2, nunca en el repo.
            test -s /opt/athenet/social.env
            printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            unset DOCKERHUB_TOKEN
            docker pull "$IMAGE_REF"
            docker rm -f athenet-social 2>/dev/null || true
            docker run -d --name athenet-social --restart unless-stopped \
              -p 8085:8085 --env-file /opt/athenet/social.env \
              --cap-drop ALL --security-opt no-new-privileges:true \
              --memory 768m --pids-limit 256 \
              --log-opt max-size=10m --log-opt max-file=3 \
              "$IMAGE_REF"
            for attempt in $(seq 1 30); do
              status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                http://127.0.0.1:8085/actuator/health || true)
              if [ "$status" = 200 ]; then
                echo 'OK: MS-Social responde UP tras el despliegue.'
                docker image prune -f >/dev/null 2>&1 || true
                exit 0
              fi
              sleep 3
            done
            echo 'ERROR: el servicio no respondio tras el despliegue.' >&2
            docker logs --tail 50 athenet-social >&2 || true
            exit 1
